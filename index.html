<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Islam G. Alhindawy</title>
    <style>
        body { margin: 0; background-color: #1a1a1a; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; width: 100%; max-width: 900px; margin-top: 50px; }
        .btn { padding: 15px; background-color: #2c3e50; color: white; border: 1px solid #3498db; cursor: pointer; border-radius: 5px; transition: 0.3s; font-weight: bold; }
        .btn:hover { background-color: #3498db; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #262626; padding: 40px; width: 80%; max-width: 800px; border-radius: 10px; border: 1px solid #3498db; position: relative; max-height: 80vh; overflow-y: auto; line-height: 1.6; }
        .close-btn { position: absolute; top: 15px; right: 25px; cursor: pointer; font-size: 2.5rem; color: #3498db; }
    </style>
</head>
<body>

    <div class="grid">
        <button class="btn" onclick="openModal('summary')">Professional Summary</button>
        <button class="btn" onclick="openModal('experience')">Career Experience</button>

        <button class="btn" onclick="openModal('skills')">Technical Skills</button>
        <button class="btn" onclick="openModal('patents')">Patents & Innovation</button>
        <button class="btn" onclick="openModal('publications')">Research Publications</button>

            <span class="close-btn" onclick="document.getElementById('mainModal').style.display='none'">&times;</span>
            <div id="modalBody"></div>

                <h3>Vision</h3>
                <p>To be a global leader in materials science and nuclear energy research, driving sustainable technological breakthroughs that address the world's most pressing energy and environmental challenges through innovation and scientific excellence.</p>
                <h3>Mission</h3>
                <p>To bridge the gap between advanced academic research and industrial application, fostering the development of efficient energy solutions while upholding the highest standards of scientific rigor, environmental safety, and educational mentorship to empower future generations of researchers.</p>
            `,
            experience: `<h2>Career Experience</h2><p>Content for this section is under preparation.</p>`,

            books: `<h2>Published Books</h2><p>Content for this section is under preparation.</p>`,
            gallery: `<h2>Field & Lab Gallery</h2><p>Content for this section is under preparation.</p>`,
            profiles: `<h2>Academic Profiles</h2><p>Content for this section is under preparation.</p>`,
            contact: `<h2>Contact Information</h2><p>Content for this section is under preparation.</p>`

        function openModal(key) {
            document.getElementById('modalBody').innerHTML = contentData[key];
            document.getElementById('mainModal').style.display = 'flex';

</body>
</html>
